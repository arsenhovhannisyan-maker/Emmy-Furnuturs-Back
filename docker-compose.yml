version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: emmy_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ''
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_DATABASE: aist_skeleton
    ports:
      - "3306:3306"
    volumes:
      - emmy_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  emmy_mysql_data:
